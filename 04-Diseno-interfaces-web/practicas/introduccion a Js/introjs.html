<!DOCTYPE html>
<html lang="es" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Componentes Bootstrap Locales</title>
  <!-- Tu archivo CSS final compilado desde SCSS -->
  <link rel="stylesheet" href="custom.css">
</head>
<body>
  <!-- Navbar con Bootstrap -->
  <nav class="navbar navbar-expand-md bg-body-tertiary border-bottom">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">MiSitio</a>
      
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto align-items-md-center">
          <li class="nav-item"><a class="nav-link" href="#">Inicio</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Servicios</a></li>
          <li class="nav-item me-md-3"><a class="nav-link" href="#">Contacto</a></li>
          <li class="nav-item mt-2 mt-md-0">
            <button id="theme-toggle" class="btn btn-outline-secondary btn-sm">Modo Oscuro</button>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Formulario de Validación -->
  <main class="container my-5" style="max-width: 500px;">
    <form id="contact-form" class="card p-4 shadow-sm needs-validation" novalidate>
      <h2 class="mb-4">Contacto</h2>
      
      <div class="mb-3">
        <label for="name" class="form-label">Nombre:</label>
        <input type="text" id="name" class="form-control" required minlength="3">
        <div class="invalid-feedback">El nombre debe tener al menos 3 caracteres.</div>
      </div>
      
      <div class="mb-3">
        <label for="email" class="form-label">Email:</label>
        <input type="email" id="email" class="form-control" required>
        <div class="invalid-feedback">Por favor, introduce un email válido.</div>
      </div>
      
      <button type="submit" class="btn btn-primary w-100">Enviar</button>
    </form>
  </main>

  <!-- REFERENCIAS LOCALES -->
  <!-- 1. JS de Bootstrap (Asegúrate de usar bootstrap.bundle.js para incluir Popper.js, necesario para dropdowns) -->
  <script src="bootstrap.bundle.min.js"></script>
  <!-- 2. Tu script de lógica personalizada -->
  <script src="script.js"></script>
</body>
</html>
