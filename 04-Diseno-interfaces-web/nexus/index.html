<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Perfil</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="perfil.css" />
  </head>
  <body>
    <header class="topbar">
      <img class="logo" src="https://placehold.co/91x65" alt="Logo" />

      <nav class="menu" aria-label="Principal">
        <a href="#">Inicio</a>
        <a href="#">Biblioteca</a>
        <a href="#">Descubrir</a>
        <a href="#" class="activo" aria-current="page">Perfil</a>
      </nav>

      <div class="acciones">
        <div class="buscador">
          <input type="search" placeholder="Buscar..." aria-label="Buscar" />
        </div>
        <img
          class="avatar"
          src="https://placehold.co/40x40"
          alt="Avatar de Juanito67"
        />
      </div>
    </header>

    <main class="perfil">
      <img
        class="perfil__avatar"
        src="https://placehold.co/80x80"
        alt="Avatar de Juanito67"
      />

      <section class="perfil__datos">
        <h1>Juanito67</h1>
        <p class="email">juenito67@email.com</p>
      </section>

      <nav class="perfil__menu" aria-label="Cuenta">
        <button type="button" class="opcion">Mis juegos</button>
        <button type="button" class="opcion">Favoritos</button>
        <button type="button" class="opcion">Ajustes</button>
        <button type="button" class="opcion">Cerrar sesión</button>
      </nav>
    </main>
  </body>
</html>
