<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario de alta</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body class="claro">
<div class="form-card">
    <h1>Formulario de alta</h1>
    <!-- Solo se pinta si existe mensajeError -->
    <div class="error-msg" th:if="${mensajeError}" th:text="${mensajeError}">Mensaje de error</div>
    <form th:action="@{/alta}" method="post">
        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" name="nombre" th:value="...">

        <label for="email">Email</label>
        <input type="email" id="email" name="email" th:value="..." required>

        <label for="tecnologia">Tecnología</label>
        <select id="tecnologia" name="tecnologia">
            <option th:each="t : ${tecnologias}" th:value="${t}" th:text="${t}" th:selected="${t == tecnologia}">Tecnología</option>
        </select>

      <label for="${listaNiveles}">Nivel (puedes marcar varios)</label>
<!--        <select id="nivel" name="nivel" multiple>-->
<!--            &lt;!&ndash; Pista: #lists.contains(lista, elemento) &ndash;&gt;-->
            <option th:each="n : ${listaNiveles}"  th:value="${n}" th:text="${n}" >Nivel</option>
<!--        </select>-->

        <button type="submit">Enviar</button>
    </form>
</div>
</body>
</html>
