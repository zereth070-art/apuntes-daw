<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario de alta</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #F7F5F0; color: #0E2438; }
        .form-card { max-width: 460px; margin: 60px auto; background: #fff; padding: 32px 36px;
            border-radius: 10px; box-shadow: 0 8px 30px rgba(0,0,0,.08); }
        label { display: block; font-weight: bold; margin: 16px 0 6px; }
        input, select { width: 100%; padding: 9px; border: 1px solid #ccc; border-radius: 6px;
            box-sizing: border-box; font-size: 1rem; }
        button { margin-top: 24px; background: #E8432A; color: #fff; border: none; padding: 12px 28px;
            border-radius: 8px; font-weight: bold; cursor: pointer; }
        button:hover { background: #c93a22; }
        .error-msg { background: #FDE8E8; color: #A00; border: 1px solid #E86E6E;
            border-radius: 6px; padding: 10px 14px; margin-top: 16px; font-weight: bold; }
    </style>
</head>
<body>
<div class="form-card">
    <h1>Formulario de alta</h1>

    <form th:action="@{/alta-validacion}" th:object="${usuario}" method="post" novalidate>
        <div class="error-msg" th:if="${mensaje}" th:text="${mensaje}"></div>

        <label for="nombre">Nombre</label>
        <input type="text"  id="nombre" th:field="*{nombre}">
        <div class="error-msg" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}">error generico</div>
        <label for="email">Email</label>
        <input type="email"  id="email" th:field="*{email}">

        <label for="tecnologia">Tecnología con la que más te gustaría trabajar</label>
        <select id="tecnologia" th:field="*{tecnologia}" required>
            <option th:each="t : ${tecnologias}"
                    th:value="${t}"
                    th:text="${t}">
            </option>
        </select>
        <div class="error-msg" th:if="${#fields.hasErrors('tecnologia')}" th:errors="*{tecnologia}">error generico</div>

        <label for="nivel">Tu nivel actual</label>
        <select id="nivel" th:field="*{niveles}" multiple>
            <option th:each="n : ${niveles}"
                    th:value="${n}"
                    th:text="${n}">
            </option>
        </select>
        <div class="error-msg" th:if="${#fields.hasErrors('niveles')}" th:errors="*{niveles}">error generico</div>
        <button type="submit">Enviar</button>
    </form>
</div>
</body>
</html>
